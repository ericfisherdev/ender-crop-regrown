modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_licence}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "${mod_description}"
logoFile = "logo-wide.png"
logoBlur = false

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

# Optional client-side HUD integration. The mod loads and runs without Jade;
# JadeCompatibility activates only when Jade is present.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
