name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release (appends -rc-<rc> to tag)"
        type: boolean
        default: false
      rc:
        description: "Release candidate number (only used when prerelease=true)"
        type: string
        default: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      minecraft_version: ${{ steps.compute.outputs.minecraft_version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute and validate tag
        id: compute
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RC: ${{ inputs.rc }}
        run: |
          set -euo pipefail
          mc_version="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2-)"
          mod_version="$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)"

          if ! [[ "$mc_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error file=gradle.properties::minecraft_version '$mc_version' is not a valid Minecraft version"
            exit 1
          fi
          if ! [[ "$mod_version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error file=gradle.properties::mod_version '$mod_version' is not a valid CalVer (YYYY.M.D[.N])"
            exit 1
          fi

          tag="${mc_version}-${mod_version}"
          if [ "$PRERELEASE" = "true" ]; then
            if ! [[ "$RC" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::rc input '$RC' must be a positive integer"
              exit 1
            fi
            tag="${tag}-rc-${RC}"
          fi

          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-[0-9]{4}\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.-]+)*$ ]]; then
            echo "::error::computed tag '$tag' does not match release tag policy"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a release (possibly a leftover draft from a failed run) already exists for $tag; delete it before retrying"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$mc_version" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $tag (prerelease=$PRERELEASE)"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.compute.outputs.tag }}
          PRERELEASE: ${{ steps.compute.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=( --draft --generate-notes --target "$GITHUB_SHA" --title "$TAG" )
          if [ "$PRERELEASE" = "true" ]; then
            flags+=( --prerelease )
          fi
          gh release create "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY"

  call-build:
    needs: prepare
    uses: ./.github/workflows/build.yml

  upload-artifacts:
    needs: [prepare, call-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v5
        with:
          name: jars
          path: jars
      - name: Upload jars to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" $(find jars -name '*.jar') --repo "$GITHUB_REPOSITORY"

  publish-fabric:
    needs: [prepare, call-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            echo 'body<<RELEASE_BODY_EOF'
            echo "$body"
            echo RELEASE_BODY_EOF
          } >> "$GITHUB_OUTPUT"
      - name: Download built jars
        uses: actions/download-artifact@v5
        with:
          name: jars
          path: jars
      - name: Publish Fabric jar
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3
        with:
          curseforge-id: 1486489
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ender-crop-regrown
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: jars/fabric/build/libs/endercrop-regrown-*-fabric.jar
          name: Ender Crop ${{ needs.prepare.outputs.tag }} (Fabric)
          version: ${{ needs.prepare.outputs.tag }}
          version-type: ${{ needs.prepare.outputs.prerelease == 'true' && 'beta' || 'release' }}
          changelog: ${{ steps.notes.outputs.body }}
          loaders: fabric
          game-versions: ${{ needs.prepare.outputs.minecraft_version }}
          java: 21

  publish-neoforge:
    needs: [prepare, call-build]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          {
            echo 'body<<RELEASE_BODY_EOF'
            echo "$body"
            echo RELEASE_BODY_EOF
          } >> "$GITHUB_OUTPUT"
      - name: Download built jars
        uses: actions/download-artifact@v5
        with:
          name: jars
          path: jars
      - name: Publish NeoForge jar
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3
        with:
          curseforge-id: 1486489
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ender-crop-regrown
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: jars/neoforge/build/libs/endercrop-regrown-*-neoforge.jar
          name: Ender Crop ${{ needs.prepare.outputs.tag }} (NeoForge)
          version: ${{ needs.prepare.outputs.tag }}
          version-type: ${{ needs.prepare.outputs.prerelease == 'true' && 'beta' || 'release' }}
          changelog: ${{ steps.notes.outputs.body }}
          loaders: neoforge
          game-versions: ${{ needs.prepare.outputs.minecraft_version }}
          java: 21

  finalize-release:
    needs: [prepare, upload-artifacts, publish-fabric, publish-neoforge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
