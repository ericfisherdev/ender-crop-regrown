plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.141"
    id "com.diffplug.spotless" version "7.0.2"
}

version = "${minecraft_version}-${mod_version}"

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

repositories {
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com/"
        content { includeGroup "curse.maven" }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        server {
            server()
            programArgument "--nogui"
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        data {
            data()
            programArguments.addAll "--mod", mod_id, "--all", "--output", file("src/generated/resources").absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Optional integration: Jade in-world HUD. Compiled against but not bundled —
    // JadeCompatibility is discovered by Jade's @WailaPlugin scan only when Jade is
    // installed, so the mod runs fine without it. Jade 26.1.1 for NeoForge,
    // CurseForge file 8068368 (pinned by Phase 1 dependency research).
    // TheOneProbe is intentionally absent: it has no MC 26.1.x release (plan R9).
    // Cloth Config is intentionally absent: NeoForge's built-in ConfigurationScreen
    // supersedes it on the 26.1.x line (plan D6).
    compileOnly("curse.maven:jade-324717:8068368") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_author", mod_author
    inputs.property "mod_licence", mod_licence
    inputs.property "mod_description", mod_description
    inputs.property "minecraft_version", minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
            version: project.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_author: mod_author,
            mod_licence: mod_licence,
            mod_description: mod_description,
            minecraft_version: minecraft_version,
        )
    }
}

spotless {
    java {
        target "src/**/*.java"
        googleJavaFormat()
        removeUnusedImports()
        formatAnnotations()
    }
}
