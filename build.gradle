plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.141"
    id "com.diffplug.spotless" version "7.0.2"
}

version = "${minecraft_version}-${mod_version}"
group = project.group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

repositories {
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com/"
        content { includeGroup "curse.maven" }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        server {
            server()
            programArgument "--nogui"
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty "neoforge.enabledGameTestNamespaces", mod_id
        }
        data {
            data()
            programArguments.addAll "--mod", mod_id, "--all", "--output", file("src/generated/resources").absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Optional integrations are wired up in Phase 4 (compat rewire). Left empty
    // here so the build does not depend on Jade / TOP / Cloth Config artifacts
    // before their 26.1.2 versions are pinned in Phase 1.
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_author", mod_author
    inputs.property "mod_licence", mod_licence
    inputs.property "mod_description", mod_description
    inputs.property "minecraft_version", minecraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
            version: project.version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_author: mod_author,
            mod_licence: mod_licence,
            mod_description: mod_description,
            minecraft_version: minecraft_version,
        )
    }
}

spotless {
    java {
        target "src/**/*.java"
        googleJavaFormat()
        removeUnusedImports()
        formatAnnotations()
    }
}
